<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Priscila 40 · Cherry</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Priscila 40 anos: uma celebração doce, cheia de amor e boas histórias. Confirme sua presença.">
<meta property="og:title" content="Priscila 40 anos · Cherry">
<meta property="og:description" content="Uma celebração doce, cheia de amor e boas histórias. Confirme sua presença.">
<meta name="theme-color" content="#a3123a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=Pinyon+Script&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Visual sempre claro (creme e cereja), mesmo com o celular no modo escuro.
   Layout: convite público em coluna estreita (mobile-first) + painel privado com barra de abas inferior no celular e superior no computador */
:root{
  --cherry:#a3123a; --cherry-deep:#6e0c27; --cherry-soft:#c8375b;
  --blush:#f8e1e6; --blush-2:#fbeef1; --cream:#fff9f4; --paper:#ffffff;
  --leaf:#3d7a4c; --leaf-soft:#e3f0e5;
  --ink:#3b1a23; --ink-2:#6b4a53; --line:#ecd3da; --shadow:0 10px 30px -18px rgba(110,12,39,.45);
  --ok:#2f7a45; --ok-bg:#e2f2e6; --warn:#9a5b00; --warn-bg:#fdf0d8; --bad:#b0232f; --bad-bg:#fbe3e5; --muted-bg:#f3e9ec;
  --f-display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-script:"Pinyon Script", "Snell Roundhand", "Segoe Script", cursive;
  --f-num:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px; --r-lg:22px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--cream);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3,.forty,.tag,.kicker,.msg,.ticket b,details.sec summary{font-variation-settings:"opsz" 18}
/* Bodoni Moda é variável: no automático, em tamanho grande o traço fino some e o 4 de "40" parece 1. Fixamos um tamanho óptico baixo. */
.hero .forty b{font-variation-settings:"opsz" 11}
h1,h2,h3{font-family:var(--f-display);font-weight:500;line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.6rem} h3{font-size:1.2rem}
p{margin:0}
a{color:var(--cherry)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cherry-soft);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}
.gutter{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-weight:600;cursor:pointer;text-decoration:none;transition:transform .15s ease, background .15s ease;-webkit-tap-highlight-color:transparent}
.btn:hover{background:var(--blush-2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--cherry);border-color:var(--cherry);color:#fff}
.btn.primary:hover{background:var(--cherry-deep);border-color:var(--cherry-deep)}
.btn.leaf{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-bg)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:40px;padding:0 14px;font-size:.9rem}
.btn.block{width:100%}
.btn.big{min-height:58px;font-size:1.08rem}
.btn svg{width:20px;height:20px;flex:none}
.iconbtn{min-width:44px;min-height:44px;border-radius:12px;border:0;background:transparent;cursor:pointer;display:inline-grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--blush-2);color:var(--cherry)}
.iconbtn svg{width:20px;height:20px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-weight:600;font-size:.92rem}
.field small{color:var(--ink-2);font-size:.82rem}
.input,select.input,textarea.input{width:100%;min-height:50px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);font-size:16px}
textarea.input{min-height:90px;resize:vertical}
.input:focus{outline:none;border-color:var(--cherry-soft);box-shadow:0 0 0 4px var(--blush)}
.input[aria-invalid="true"]{border-color:var(--bad)}
.err{color:var(--bad);font-size:.85rem;font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--cherry);flex:none;margin-top:2px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap;background:var(--muted-bg);color:var(--ink-2)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.cherry{background:var(--blush);color:var(--cherry)}
.pill.demo{background:transparent;border:1px dashed var(--ink-2);color:var(--ink-2);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}

/* ============ INVITE ============ */
.invite{max-width:560px;margin:0 auto;padding-block:20px 48px;position:relative}
.hero{position:relative;text-align:center;padding:28px 18px 30px;border-radius:var(--r-lg);background:radial-gradient(120% 80% at 50% 0%, var(--blush) 0%, var(--cream) 70%);overflow:hidden;border:1px solid var(--line)}
.hero .fall{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hero .fall svg{position:absolute;top:-40px;width:22px;height:28px;opacity:.55;animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-40px) rotate(-10deg)}to{transform:translateY(760px) rotate(25deg)}}
.arch{width:min(200px,52vw);aspect-ratio:3/4;max-width:100%;margin:6px auto 18px;border-radius:999px 999px 26px 26px;overflow:hidden;background:var(--blush);border:6px solid var(--paper);box-shadow:var(--shadow);display:grid;place-items:center;position:relative}
.arch img{width:100%;height:100%;object-fit:cover}
.arch .ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--cherry);padding:16px;text-align:center}
.arch .ph svg{width:64px;height:76px}
.hero .script{font-family:var(--f-script);font-size:clamp(3.4rem,15vw,4.6rem);line-height:1;color:var(--cherry);position:relative}
.hero .forty{font-family:var(--f-display);font-size:clamp(1.3rem,5vw,1.6rem);letter-spacing:.32em;text-transform:uppercase;color:var(--ink);margin-top:6px}
.hero .forty b{font-weight:600;font-size:1.6em;letter-spacing:.04em;color:var(--cherry-deep);font-style:italic;margin-right:.12em}
.hero .tag{font-family:var(--f-display);font-style:italic;font-size:1.12rem;color:var(--ink-2);max-width:34ch;margin:14px auto 0}
.theme-badge{display:inline-flex;align-items:center;gap:6px;margin-top:16px;padding:6px 14px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--leaf)}
.theme-badge svg{width:16px;height:16px}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.countdown div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.countdown b{display:block;font-family:var(--f-num);font-size:1.6rem;font-weight:600;color:var(--cherry);font-variant-numeric:tabular-nums;line-height:1.1}
.countdown span{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2)}
.sect{margin-top:18px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.facts{display:grid;gap:14px}
.fact{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.fact .ic{width:40px;height:40px;border-radius:12px;background:var(--blush-2);display:grid;place-items:center;color:var(--cherry)}
.fact .ic svg{width:20px;height:20px}
.fact .v{font-weight:600}
.tbd{display:inline-block;color:var(--ink-2);font-style:normal;font-weight:600;font-size:.9rem;padding:1px 10px;border:1.5px dashed color-mix(in srgb,var(--cherry) 30%,var(--line));border-radius:999px;background:var(--paper)}
.cta-bar{margin-top:20px;display:grid;gap:10px}
/* no celular o botão de confirmar fica sempre ao alcance do polegar */
@media (max-width:640px){.cta-bar{position:sticky;bottom:0;z-index:3;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--cream) 70%,transparent)}}
.privacy{font-size:.82rem;color:var(--ink-2);text-align:center;margin-top:18px}
.host-link{display:block;text-align:center;margin-top:26px;font-size:.85rem;color:var(--ink-2)}
.divider{display:flex;align-items:center;gap:12px;justify-content:center;color:var(--cherry);margin:4px 0}
.divider::before,.divider::after{content:"";height:1px;flex:1;background:var(--line)}
.divider svg{width:20px;height:24px}

/* ============ RSVP ============ */
.rsvp{max-width:560px;margin:0 auto;padding-block:16px 48px}
.rsvp-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.steps{display:flex;gap:6px;margin:10px 0 18px}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--cherry)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow)}
.choice{display:grid;gap:12px}
.choice button{display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--paper);cursor:pointer;min-height:76px}
.choice button:hover{border-color:var(--cherry-soft)}
.choice button[aria-pressed="true"]{border-color:var(--cherry);background:var(--blush-2)}
.choice .em{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--blush);color:var(--cherry);font-size:1.4rem}
.choice b{display:block;font-size:1.05rem}
.choice small{color:var(--ink-2)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);font-size:1.5rem;cursor:pointer;color:var(--cherry)}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper output{font-family:var(--f-num);font-weight:600;font-size:2rem;min-width:2ch;text-align:center}
.review{display:grid;gap:10px}
.review div{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.review dt{color:var(--ink-2)} .review dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.done{text-align:center}
.done .seal{width:96px;height:96px;margin:0 auto 12px;border-radius:50%;background:var(--blush);display:grid;place-items:center;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.done .seal svg{width:52px;height:62px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* ============ PRIVATE SHELL ============ */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--cream) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand svg{width:26px;height:32px}
.brand b{font-family:var(--f-script);font-size:2rem;color:var(--cherry);font-weight:400;line-height:1}
.brand span{font-family:var(--f-num);font-weight:600;font-size:.9rem;letter-spacing:.08em;color:var(--cherry-deep);text-transform:uppercase}
.tabs{display:flex;gap:4px}
.tabs a{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:.95rem}
.tabs a svg{width:20px;height:20px}
.tabs a[aria-current="page"]{background:var(--blush);color:var(--cherry)}
.tabs a:hover{color:var(--cherry)}
.main{max-width:1120px;margin:0 auto;padding-block:22px 110px}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.page-head p{color:var(--ink-2)}
@media (max-width:820px){
  .topbar .tabs{display:none}
  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;min-height:54px;border-radius:12px;text-decoration:none;color:var(--ink-2);font-size:.72rem;font-weight:600}
  .bottomnav a svg{width:22px;height:22px}
  .bottomnav a[aria-current="page"]{color:var(--cherry);background:var(--blush-2)}
}
@media (min-width:821px){.bottomnav{display:none}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;min-width:0}
.panel h3{margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 16px;min-width:0}
.report{margin-top:14px;border-color:color-mix(in srgb,var(--cherry) 22%,var(--line))}
.rep-kpis{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:12px}
.rep-kpis .v{font-family:var(--f-num);font-size:1.9rem;font-weight:700;color:var(--cherry);line-height:1.1}
.rep-kpis .s{font-size:.8rem;color:var(--ink-2)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.pill svg{width:14px;height:14px;flex:none}
.kpi .v{font-family:var(--f-num);font-size:clamp(1.15rem,4.4vw,1.55rem);white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px;overflow-wrap:anywhere}
.kpi .s{font-size:.82rem;color:var(--ink-2)}
.kpi.hl{background:var(--blush-2);border-color:var(--blush)}
.kpi.hl .v{color:var(--cherry)}
.kpi.neg .v{color:var(--bad)} .kpi.pos .v{color:var(--ok)}
.dash{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.dash>*{grid-column:span 12}
@media (min-width:900px){.dash .c6{grid-column:span 6}.dash .c7{grid-column:span 7}.dash .c5{grid-column:span 5}.dash .c4{grid-column:span 4}.dash .c8{grid-column:span 8}}
.welcome{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:linear-gradient(120deg,var(--blush) 0%,var(--blush-2) 60%,var(--paper) 100%);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px}
.welcome .script{font-family:var(--f-script);font-size:2.6rem;color:var(--cherry);line-height:1}
.welcome .big{font-family:var(--f-num);font-weight:600;font-size:2.4rem;color:var(--cherry-deep);line-height:1;text-align:center}
.welcome .big small{display:block;font-family:var(--f-body);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-top:4px}
.stackbar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--muted-bg);margin:10px 0}
.stackbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.85rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.meter{height:16px;border-radius:99px;background:var(--muted-bg);overflow:hidden;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .main-t{flex:1;min-width:0}
.li .main-t b{display:block;overflow-wrap:anywhere}
.li .meta{font-size:.85rem;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px}
.shortcuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.shortcut{display:flex;align-items:center;gap:10px;padding:14px;border-radius:16px;background:var(--blush-2);text-decoration:none;color:var(--ink);font-weight:600;border:1px solid transparent;min-height:56px;cursor:pointer;font-size:.95rem;text-align:left}
.shortcut:hover{border-color:var(--cherry-soft)}
.shortcut svg{width:22px;height:22px;color:var(--cherry);flex:none}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.toolbar .input{min-height:46px;width:auto;flex:1 1 180px}
.toolbar select.input{flex:0 1 190px}
.empty{text-align:center;padding:36px 16px;color:var(--ink-2)}
.empty svg{width:48px;height:58px;opacity:.6;margin-bottom:8px}
.rec{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--paper);align-items:start}
.rec+.rec{margin-top:10px}
.rec .t{font-weight:700;overflow-wrap:anywhere}
.rec .meta{font-size:.86rem;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px}
.rec .side{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.rec .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.rec.done .t{text-decoration:line-through;color:var(--ink-2)}
.rec.alert{border-left:4px solid var(--warn)}
.rec.overdue{border-left:4px solid var(--bad)}
@media (max-width:520px){.rec{grid-template-columns:1fr}.rec .side{text-align:left;align-items:flex-start;flex-direction:row;flex-wrap:wrap}}
.money-line{font-variant-numeric:tabular-nums;font-size:.9rem}
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:minmax(90px,130px) 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.bar .track{height:14px;background:var(--muted-bg);border-radius:99px;overflow:hidden;position:relative}
.bar .track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.bar .track i.cost{background:var(--blush);background:color-mix(in srgb,var(--cherry) 30%,var(--paper))}
.bar .track i.paid{background:var(--cherry)}
.bar .val{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--warn-bg);color:var(--warn);font-size:.92rem}
.notice.info{background:var(--blush-2);color:var(--ink)}
.notice.ok{background:var(--ok-bg);color:var(--ok)}
.notice svg{width:20px;height:20px;flex:none;margin-top:2px}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.switch input{appearance:none;width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked{background:var(--leaf)}
.switch input:checked::after{left:25px}
details.sec{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--paper);padding:0 20px}
details.sec+details.sec{margin-top:12px}

function csvCell(v){v=String(v==null?'':v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function toCSV(rows){return rows.map(r=>r.map(csvCell).join(';')).join('\n')}
function parseCSV(text){
  text=text.replace(/^﻿/,'');const first=text.split('\n')[0]||'';const sep=(first.split(';').length>=first.split(',').length)?';':',';
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;else if(c===sep){row.push(cell);cell=''}else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(c!=='\r')cell+=c}
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}

function photoPreview(){const root=document.getElementById('photo-preview');if(!root)return;root.innerHTML=photoFiles.map((f,i)=>'<div style="position:relative"><img src="'+f.url+'" alt="Prévia de '+esc(f.file.name)+'" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px"><button type="button" class="btn sm" data-act="photo-remove" data-index="'+i+'" aria-label="Remover '+esc(f.file.name)+'" style="position:absolute;right:4px;top:4px">×</button></div>').join('');const b=document.getElementById('photo-submit');if(b)b.disabled=!photoFiles.length||albumBusy}
function viewPhotosAdmin(){return '<div class="page-head"><div><h2>Fotos da festa</h2><p>Álbum privado · revise as fotos antes de exibi-las aos convidados.</p></div><button class="btn" data-act="album-refresh">Atualizar</button></div><section class="panel stack"><label class="switch"><input type="checkbox" id="album-immediate" data-act="album-setting">Exibir fotos imediatamente após o envio</label><p class="small muted">Desativado: as imagens ficam privadas até você aprovar. Os links incluem uma chave exclusiva da festa.</p><div class="row"><input class="input" id="album-url" readonly aria-label="Link privado do álbum"><button class="btn" data-act="album-copy">Copiar link</button><button class="btn" data-act="album-share">Compartilhar link</button><button class="btn" data-act="album-qr">Gerar QR Code</button><button class="btn" data-act="album-rotate">Gerar novo link</button><button class="btn" data-act="album-download-all">Baixar todas as aprovadas</button></div><div id="album-qr-preview" aria-live="polite"></div><div id="album-admin" class="stack" aria-live="polite">Carregando álbum…</div></section>'}
function appendAdminPhotoBatch(){const root=document.getElementById('album-admin');if(!root)return;const batch=adminPhotoRows.slice(adminShown,adminShown+12);if(!batch.length&&adminShown===0){root.innerHTML='<div class="notice info">Nenhuma foto enviada ainda.</div>';return}root.querySelector('#album-more')?.remove();if(batch.length){root.insertAdjacentHTML('beforeend',photoGrid(batch,albumToken,true));adminShown+=batch.length;root.querySelectorAll('img[data-photo-id]:not([data-loaded])').forEach(async img=>{img.dataset.loaded='1';try{const x=await photoCall({action:'admin_image',id:img.dataset.photoId});img.src='data:'+x.mime+';base64,'+x.data}catch(_){img.alt='Prévia indisponível'}})}if(adminShown<adminPhotoRows.length)root.insertAdjacentHTML('beforeend','<button class="btn" id="album-more" data-act="album-more">Carregar mais fotos</button>')}
async function loadAdminAlbum(){try{const r=await photoCall({action:'admin_load'});albumToken=r.token;adminPhotoRows=r.photos||[];adminShown=0;const u=document.getElementById('album-url'),c=document.getElementById('album-immediate'),root=document.getElementById('album-admin');if(u)u.value=albumLink(albumToken);if(c)c.checked=r.publishImmediately;if(root){root.innerHTML='';appendAdminPhotoBatch()}}catch(_){const root=document.getElementById('album-admin');if(root)root.innerHTML='<div class="notice">Não foi possível carregar o álbum. Verifique sua conexão e tente novamente.</div>'}}
async function downloadApprovedPhoto(id){try{const r=await photoCall({action:'download',id:id||null});for(let i=0;i<r.photos.length;i++){const p=r.photos[i],x=await photoCall({action:'admin_image',id:p.id}),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([Uint8Array.from(atob(x.data),c=>c.charCodeAt(0))],{type:x.mime}));a.download=(slug(S.party.name)||'festa')+'-'+p.id+'.'+({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[x.mime]||'jpg');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),30000);if(r.photos.length>1)await new Promise(ok=>setTimeout(ok,350))}if(!r.photos.length)toast('Não há fotos aprovadas para baixar.')}catch(_){toast('Não foi possível baixar as fotos aprovadas.')}}
function compressGuestPhoto(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject();reader.onload=()=>{const img=new Image();img.onerror=()=>reject();img.onload=()=>{const max=1800,k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.82).split(',')[1])};img.src=reader.result};reader.readAsDataURL(file)})}

function startCountdown(){
  const t=partyDate();if(!t||!document.getElementById('cd'))return;
  const tick=()=>{let ms=t-new Date();const el=document.getElementById('cd');if(!el){clearInterval(cdTimer);return}
    if(ms<=0){el.outerHTML='<p class="tag" style="margin-top:16px;color:var(--cherry)">É hoje! Que comece a festa 🍒</p>';clearInterval(cdTimer);return}
    const d=Math.floor(ms/864e5);ms-=d*864e5;const h=Math.floor(ms/36e5);ms-=h*36e5;const m=Math.floor(ms/6e4);const s=Math.floor((ms-m*6e4)/1e3);
    document.getElementById('cd-d').textContent=d;document.getElementById('cd-h').textContent=pad(h);document.getElementById('cd-m').textContent=pad(m);document.getElementById('cd-s').textContent=pad(s)};
  tick();cdTimer=setInterval(tick,1000);
}

/* ================= CONFIRMAÇÃO (RSVP) ================= */
let rsvp=newRsvp();
function newRsvp(){return {step:1,name:'',phone:'',consent:false,answer:'',count:0,companions:[],diet:'',notes:'',existingId:'',limit:S?Number(S.party.maxCompanions)||0:2,errors:{}}}
function stepLabel(n){return {1:'Seus dados',2:'Presença',3:rsvp.answer==='no'?'Recado':'Acompanhantes e observações',5:'Revisão'}[n]}
function stepsFor(){return [1,2,3,5]}
function viewRsvp(){
  const closed=rsvpClosed();const p=S.party;
  const head='<div class="rsvp-top"><a class="iconbtn" href="#convite" aria-label="Voltar ao convite">'+ic('back')+'</a><div><div class="label">'+esc(p.name)+' '+partyAge()+' anos</div><h1 style="font-size:1.5rem">Confirmar presença</h1></div></div>';
  const when=[p.date?fmtDateLong(p.date):'Data a confirmar',p.time?p.time.replace(':','h'):'',p.venue||''].filter(Boolean);
  const ticket='<div class="ticket">'+cherry()+'<div><b>Aniversário de '+partyAge()+' anos da '+esc(p.name)+'</b><div class="meta">'+when.map(w=>'<span>'+esc(w)+'</span>').join('')+'</div></div></div>';
  if(closed&&rsvp.step!==6)return '<main class="rsvp gutter">'+head+'<div class="card"><div class="notice info">'+ic('info')+'<span>'+esc(closed)+'</span></div><a class="btn block" style="margin-top:16px" href="#convite">Voltar ao convite</a></div></main>';
  if(rsvp.step===6)return '<main class="rsvp gutter">'+viewRsvpDone()+'</main>';
  const seq=stepsFor();const idx=seq.indexOf(rsvp.step);
  const bar='<ol class="progress" aria-label="Etapas da confirmação">'+seq.map((n,i)=>'<li class="'+(i<=idx?'on':'')+'"'+(i===idx?' aria-current="step"':'')+'><span>'+stepLabel(n)+'</span></li>').join('')+'</ol><p class="label" style="margin-bottom:12px">Etapa '+(idx+1)+' de '+seq.length+' · '+stepLabel(rsvp.step)+'</p>';
  let body='';const e=rsvp.errors;
  if(rsvp.step===1){
    body='<form data-form="rsvp1" class="stack" novalidate><h2>Que bom ver você por aqui!</h2><p class="muted">Conte quem é você para a '+esc(p.name)+' saber quem respondeu.</p>'+
     '<label class="field"><span>Seu nome completo</span><input class="input" id="r-name" name="name" autocomplete="name" value="'+esc(rsvp.name)+'" aria-invalid="'+(!!e.name)+'" maxlength="80" required>'+(e.name?'<span class="err">'+e.name+'</span>':'')+'</label>'+
     '<label class="field"><span>WhatsApp com DDD</span><input class="input" id="r-phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="(11) 91234-5678" value="'+esc(rsvp.phone)+'" aria-invalid="'+(!!e.phone)+'" maxlength="20" required><small>Usado só para a '+esc(p.name)+' falar com você sobre a festa.</small>'+(e.phone?'<span class="err">'+e.phone+'</span>':'')+'</label>'+
     '<label class="check"><input type="checkbox" id="r-consent" name="consent" '+(rsvp.consent?'checked':'')+'><span class="small">Concordo que meus dados sejam usados apenas para a organização desta comemoração.</span></label>'+(e.consent?'<span class="err">'+e.consent+'</span>':'')+
     '<button class="btn primary big block" type="submit">Continuar</button></form>';
  } else if(rsvp.step===2){
    const opt=(k,em,t,s)=>'<button type="button" data-act="rsvp-answer" data-v="'+k+'" aria-pressed="'+(rsvp.answer===k)+'"><span class="em">'+em+'</span><span><b>'+t+'</b><small>'+s+'</small></span></button>';
    body='<div class="stack">'+(rsvp.existingId?'<div class="notice ok">'+ic('check')+'<span>Encontramos sua resposta anterior. Você pode atualizá-la agora.</span></div>':'')+'<h2>Você vem, '+esc(rsvp.name.split(' ')[0])+'?</h2><div class="choice" role="group" aria-label="Sua resposta">'+
      opt('yes',cherry(),'Vou','Conte comigo nessa celebração')+opt('no','<span aria-hidden="true">💌</span>','Não poderei ir','Vou mandar meu carinho de longe')+opt('maybe','<span aria-hidden="true">⏳</span>','Ainda não sei','Respondo assim que tiver certeza')+
      '</div>'+(e.answer?'<span class="err">'+e.answer+'</span>':'')+navBtns()+'</div>';
  } else if(rsvp.step===3){
    const lim=rsvp.limit,no=rsvp.answer==='no';
    const comp=no?'':(lim>0?'<p class="muted">Você pode levar até '+lim+' acompanhante'+(lim>1?'s':'')+'.</p><div class="stepper"><button type="button" data-act="rsvp-count" data-d="-1" aria-label="Menos um acompanhante" '+(rsvp.count<=0?'disabled':'')+'>−</button><output aria-live="polite" class="num">'+rsvp.count+'</output><button type="button" data-act="rsvp-count" data-d="1" aria-label="Mais um acompanhante" '+(rsvp.count>=lim?'disabled':'')+'>+</button><span class="muted">acompanhante'+(rsvp.count===1?'':'s')+'</span></div>'+
      Array.from({length:rsvp.count},(_,i)=>'<label class="field"><span>Nome do acompanhante '+(i+1)+'</span><input class="input" name="c'+i+'" id="r-c'+i+'" value="'+esc(rsvp.companions[i]||'')+'" maxlength="80" aria-invalid="'+(!!e['c'+i])+'">'+(e['c'+i]?'<span class="err">'+e['c'+i]+'</span>':'')+'</label>').join('')
      :'<div class="notice info">'+ic('info')+'<span>Este convite é individual. Se tiver alguma dúvida, fale com a '+esc(p.name)+'.</span></div>');
    body='<form data-form="rsvp3" class="stack" novalidate><h2>'+(no?'Quer deixar um recado?':'Vai alguém com você?')+'</h2>'+comp+
      (no?'':'<label class="field"><span>Restrições alimentares <span class="muted" style="font-weight:400">(opcional)</span></span><input class="input" id="r-diet" name="diet" maxlength="160" placeholder="Ex.: vegetariana, sem glúten, alergia a camarão" value="'+esc(rsvp.diet)+'"></label>')+
      '<label class="field"><span>'+(no?'Recado para a '+esc(p.name):'Observações')+' <span class="muted" style="font-weight:400">(opcional)</span></span><textarea class="input" id="r-notes" name="notes" maxlength="400">'+esc(rsvp.notes)+'</textarea></label>'+
      navBtns(true)+'</form>';
  } else if(rsvp.step===5){
    const rows=[['Nome',esc(rsvp.name)],['WhatsApp',esc(fmtPhone(rsvp.phone))],['Resposta',esc({yes:'Vou',no:'Não poderei ir',maybe:'Ainda não sei'}[rsvp.answer])]];
    if(rsvp.answer!=='no'){rows.push(['Acompanhantes',rsvp.count?esc(rsvp.companions.slice(0,rsvp.count).join(', ')):'Nenhum']);rows.push(['Total de pessoas','<span class="num">'+(1+rsvp.count)+'</span>']);if(rsvp.diet)rows.push(['Restrições',esc(rsvp.diet)])}
    if(rsvp.notes)rows.push([rsvp.answer==='no'?'Recado':'Observações',esc(rsvp.notes)]);
    body='<div class="stack"><h2>Confira antes de enviar</h2><dl class="review">'+rows.map(r=>'<div><dt>'+r[0]+'</dt><dd>'+r[1]+'</dd></div>').join('')+'</dl>'+
      '<div class="row"><button class="btn" data-act="rsvp-back">Voltar</button><span class="spacer"></span><button class="btn primary big" data-act="rsvp-submit">'+ic('check')+'Confirmar resposta</button></div>'+
      (e.submit?'<div class="notice" role="alert" style="background:var(--bad-bg);color:var(--bad)">'+ic('alert')+'<span>'+esc(e.submit)+'</span></div>':'')+
      '<button class="btn ghost sm" data-act="rsvp-goto" data-s="1">Corrigir meus dados</button></div>';
  }
  return '<main class="rsvp gutter">'+head+ticket+bar+'<div class="card">'+body+'</div><p class="privacy">Seus dados são usados apenas para a organização da comemoração e não aparecem para outros convidados.</p></main>';
}
function navBtns(submit){return '<div class="row" style="margin-top:6px"><button type="button" class="btn" data-act="rsvp-back">Voltar</button><span class="spacer"></span>'+(submit?'<button class="btn primary" type="submit">Continuar</button>':'<button type="button" class="btn primary" data-act="rsvp-next2">Continuar</button>')+'</div>'}
function rsvpNav(dir){const seq=stepsFor();const i=seq.indexOf(rsvp.step);rsvp.errors={};if(dir<0&&i===0){go('convite');return}rsvp.step=seq[Math.max(0,Math.min(seq.length-1,i+dir))];render();focusFirst()}
function viewRsvpDone(){
  const p=S.party;const a=rsvp.answer;
  const msg={yes:'Presença confirmada!',no:'Resposta registrada',maybe:'Resposta registrada'}[a];
  const sub={yes:'Que alegria! A '+esc(p.name)+' vai adorar celebrar com você'+(rsvp.count?' e com '+(rsvp.count===1?'seu acompanhante':'seus '+rsvp.count+' acompanhantes'):'')+'.',no:'Obrigada por avisar. Seu carinho chega até a '+esc(p.name)+'.',maybe:'Sem problema! Volte a este convite quando souber e atualize sua resposta.'}[a];
  return '<div class="card done stack"><div class="seal">'+cherry()+'</div><h1 style="font-size:1.8rem">'+msg+'</h1><p class="muted">'+sub+'</p>'+
   (a!=='no'&&p.date?'<div class="sect" style="margin:0;text-align:left">'+factRow('cal','Anote na agenda',esc(fmtDateLong(p.date))+(p.time?' às '+esc(p.time.replace(':','h')):''))+'</div><a class="btn primary block" href="'+gcalLink()+'" target="_blank" rel="noopener">'+ic('cal')+'Salvar na agenda</a>':'')+
   '<button class="btn block" data-act="rsvp-edit">'+ic('edit')+'Alterar minha resposta</button>'+
   '<a class="btn ghost block" href="#convite">Voltar ao convite</a></div>';

const RSVP_ERR={closed:'As confirmações estão encerradas. Fale com a aniversariante se precisar.',too_many_companions:'O número de acompanhantes passou do permitido. Volte e ajuste.',invalid_phone:'O WhatsApp parece incompleto. Corrija seus dados.',invalid_name:'Confira seu nome em “Corrigir meus dados”.',invalid_companion:'Confira os nomes dos acompanhantes.',not_configured:'O convite ainda está sendo preparado. Tente de novo mais tarde.',full:'Não foi possível registrar mais respostas. Fale com a aniversariante.'};
function rsvpSubmit(){
  const p=S.party;const now=new Date().toISOString().slice(0,10);
  const data={name:rsvp.name.trim(),phone:digits(rsvp.phone),status:rsvp.answer,companions:rsvp.answer==='no'?[]:rsvp.companions.slice(0,rsvp.count).map(s=>s.trim()),diet:rsvp.answer==='no'?'':rsvp.diet.trim(),notes:rsvp.notes.trim(),respondedAt:now};
  if(REMOTE){
    const b=document.querySelector('[data-act=rsvp-submit]');if(b){b.setAttribute('aria-busy','true');b.textContent='Enviando sua resposta…'}
    rpc('submit_rsvp',{name:data.name,phone:normPh(data.phone),status:data.status,companions:data.companions,diet:data.diet,notes:data.notes})
      .then(()=>{rsvp.step=6;rsvp.errors={};render();window.scrollTo(0,0)})
      .catch(e=>{rsvp.errors={submit:RSVP_ERR[e.code]||'Não foi possível enviar agora. Verifique a conexão e tente de novo.'};render()});
    return;
  }
  let g=rsvp.existingId&&S.guests.find(x=>x.id===rsvp.existingId);
  if(g){Object.assign(g,data)}else{S.guests.push(Object.assign({id:uid(),group:'Pelo convite',allowed:Number(p.maxCompanions)||0,demo:false},data))}
  save();rsvp.step=6;render();window.scrollTo(0,0);
}

function importModal(){

   '<label class="field"><span>Arquivo CSV</span><input class="input" id="imp-file" type="file" accept=".csv,text/csv,text/plain" data-act="imp-file"></label>'+
   '<label class="field"><span>Ou cole as linhas aqui</span><textarea class="input" id="imp-text" rows="6" placeholder="nome;whatsapp;grupo;acompanhantes_permitidos&#10;Maria Souza;11912345678;Família;2"></textarea></label><div class="err" id="imp-err"></div></div>',
   '<button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="imp-run">'+ic('upload')+'Importar</button>');

function runImport(){
  const txt=document.getElementById('imp-text').value.trim();const err=document.getElementById('imp-err');
  if(!txt){err.textContent='Escolha um arquivo ou cole as linhas para importar.';return}
  const rows=parseCSV(txt);if(rows.length<2){err.textContent='Não encontramos linhas de convidados. Confira se a primeira linha é o cabeçalho.';return}
  const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z_]/g,'');
  const h=rows[0].map(norm);const col=(...names)=>h.findIndex(x=>names.includes(x));
  const ci={name:col('nome','name'),phone:col('whatsapp','telefone','celular','phone'),group:col('grupo','familia','grupoufamilia','group'),allowed:col('acompanhantes_permitidos','acompanhantespermitidos','acompanhantes_perm','permitidos'),status:col('status'),comp:col('acompanhantes','acompanhantes_confirmados'),diet:col('restricoes','restricoes_alimentares','restricoesalimentares'),notes:col('observacoes','obs'),date:col('data_resposta','dataresposta')};
  if(ci.name<0){err.textContent='A coluna "nome" não foi encontrada no cabeçalho.';return}
  const stMap={'vai':'yes','sim':'yes','yes':'yes','nao vai':'no','nao':'no','no':'no','ainda nao sabe':'maybe','talvez':'maybe','maybe':'maybe'};
  let added=0,updated=0;
  rows.slice(1).forEach(r=>{const v=i=>i>=0?(r[i]||'').trim():'';const name=v(ci.name);if(!name)return;
    const st=stMap[v(ci.status).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')]||'pending';
    const data={name,phone:digits(v(ci.phone)),group:v(ci.group),allowed:parseInt(v(ci.allowed))||Number(S.party.maxCompanions)||0,status:st,companions:v(ci.comp)?v(ci.comp).split(',').map(s=>s.trim()).filter(Boolean):[],diet:v(ci.diet),notes:v(ci.notes),respondedAt:st!=='pending'?(v(ci.date).match(/^(\d{2})\/(\d{2})\/(\d{4})$/)?v(ci.date).replace(/^(\d{2})\/(\d{2})\/(\d{4})$/,'$3-$2-$1'):today()):''};
    const ex=data.phone&&S.guests.find(g=>digits(g.phone)===data.phone);
    if(ex){Object.assign(ex,data);ex.demo=false;updated++}else{S.guests.push(Object.assign({id:uid(),demo:false},data));added++}});
  save();closeModal();render();toast(added+' adicionado(s), '+updated+' atualizado(s)');
}

  return toCSV([['nome','whatsapp','grupo','acompanhantes_permitidos','status','pessoas_confirmadas','acompanhantes','restricoes','observacoes','data_resposta']].concat(S.guests.map(g=>[g.name,fmtPhone(g.phone),g.group,g.allowed,G_ST[g.status],g.status==='yes'?1+(g.companions||[]).length:0,(g.companions||[]).join(', '),g.diet,g.notes,fmtDate(g.respondedAt)])));
}

  return S.guests.filter(g=>g.status==='yes'&&!g.demo&&(!rFilter.group||g.group===rFilter.group)&&(!q||(g.name+' '+(g.companions||[]).join(' ')).toLowerCase().includes(q)))
    .sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
}
function reportPeople(list){return list.reduce((n,g)=>n+1+(g.companions||[]).length,0)}
function reportSection(){
  const list=reportList(),people=reportPeople(list);
  const groups=[...new Set(S.guests.filter(g=>g.status==='yes'&&!g.demo).map(g=>g.group).filter(Boolean))].sort();
  const demo=S.guests.some(g=>g.demo&&g.status==='yes');
  const filtered=rFilter.q.trim()||rFilter.group;
  return '<section class="panel report" id="relatorio" aria-labelledby="rep-h"><div class="row"><h3 id="rep-h" style="margin:0">Convidados confirmados</h3><span class="spacer"></span><span class="pill ok"><i class="dot"></i>Só quem respondeu “Vou”</span></div>'+
   '<div class="rep-kpis"><div><div class="label">Convites confirmados</div><div class="v">'+list.length+'</div></div><div><div class="label">Pessoas esperadas</div><div class="v">'+people+'</div><div class="s">com acompanhantes</div></div></div>'+
   '<div class="toolbar" style="margin:12px 0 0"><input class="input" id="r-q" type="search" placeholder="Filtrar por nome" value="'+esc(rFilter.q)+'" data-filter="r-q" aria-label="Filtrar o relatório por nome">'+
    (groups.length?'<select class="input" id="r-gr" data-filter="r-gr" aria-label="Filtrar o relatório por grupo"><option value="">Todos os grupos</option>'+groups.map(g=>'<option '+(rFilter.group===g?'selected':'')+'>'+esc(g)+'</option>').join('')+'</select>':'')+
    '<label class="switch"><input type="checkbox" id="r-notes" data-filter="r-notes" '+(rFilter.notes?'checked':'')+'>Incluir observações</label></div>'+
   (repMsg?'<div class="notice '+(repMsg.bad?'':'info')+'" role="alert" style="margin-top:12px">'+ic(repMsg.bad?'alert':'info')+'<span>'+esc(repMsg.text)+'</span></div>':'')+
   '<div class="row" style="margin-top:12px">'+
    '<button class="btn primary" data-act="report-pdf"'+(list.length?'':' disabled')+(repBusy?' aria-busy="true"':'')+'>'+(repBusy?'Gerando PDF…':ic('download')+'Baixar relatório em PDF')+'</button>'+
    (REMOTE?'<button class="btn" data-act="refresh">Atualizar respostas</button>':'')+
    (filtered?'<button class="btn" data-act="report-clear">Limpar filtros</button>':'')+'</div>'+
   '<p class="small muted" style="margin-top:10px">'+(list.length?'':(filtered?'Nenhum confirmado com esses filtros. ':'Ainda não há convidados confirmados. ')+'')+
    'O PDF traz nome, acompanhantes e total de pessoas'+(rFilter.notes?', com restrições alimentares e observações':'')+'. Telefones e valores da festa não entram.'+(demo?' Convidados de exemplo também ficam de fora.':'')+'</p></section>';
}
const PDF_LIBS=['vendor/jspdf.umd.min.js','vendor/jspdf.plugin.autotable.min.js'];
let pdfLibP=null;
function loadScript(src){return new Promise((ok,fail)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>fail(new Error('load '+src));document.head.appendChild(s)})}
function loadPdfLib(){
  if(!pdfLibP)pdfLibP=PDF_LIBS.reduce((p,src)=>p.then(()=>loadScript(src)),Promise.resolve()).then(()=>{
    const J=window.jspdf&&window.jspdf.jsPDF;if(!J)throw new Error('jspdf');
    if(typeof window.applyPlugin==='function')window.applyPlugin(J);return J;
  }).catch(e=>{pdfLibP=null;throw e});
  return pdfLibP;
}
function slug(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function reportFileName(){return 'convidados-confirmados-'+(slug(S.party.name)||'festa')+'-'+partyAge()+'-anos.pdf'}
async function downloadReport(){
  if(repBusy)return;
  repBusy=true;repMsg=null;render();
  try{
    if(REMOTE&&authed)await refreshRemote(true);
    const list=reportList();
    if(!list.length){repMsg={text:'Ainda não há convidados confirmados'+(rFilter.q.trim()||rFilter.group?' com esses filtros':'')+'. Nada foi gerado.'};return}
    const J=await loadPdfLib();
    const doc=buildReportPdf(J,list);
    const name=reportFileName();
    doc.save(name);
    toast('PDF gerado: '+name);
  }catch(e){
    console.error(e);
    repMsg={bad:true,text:'Não foi possível gerar o PDF agora. Verifique a conexão e tente de novo.'};
  }finally{repBusy=false;render()}
}
// Base comum dos PDFs do painel (convidados e finanças): mesmo cabeçalho, rodapé, cartões e tabelas no tema Cherry.
function pdfKit(J,sub){
  const p=S.party,age=partyAge();
  const C={cherry:[163,18,58],deep:[110,12,39],blush:[248,225,230],blush2:[251,238,241],cream:[255,249,244],ink:[59,26,35],muted:[107,74,83],line:[234,205,212],leaf:[61,122,76]};
  const doc=new J({unit:'mm',format:'a4',orientation:'portrait'});
  const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),M=16;
  const title=(p.name||'Aniversário')+' '+age+' anos — Festa Cherry';
  const now=new Date(),two=n=>String(n).padStart(2,'0');
  const gen='Relatório gerado em '+two(now.getDate())+'/'+two(now.getMonth()+1)+'/'+now.getFullYear()+' às '+two(now.getHours())+'h'+two(now.getMinutes());
  const when=p.date?fmtDateLong(p.date).replace(/^./,c=>c.toUpperCase())+(p.time?' às '+p.time.replace(':','h'):''):'';
  doc.setProperties({title:title+' · '+sub,subject:sub,creator:'Festa Cherry'});
  const cherryAt=(x,y,s)=>{ // par de cerejas pequeno; (x,y) = canto superior esquerdo
    doc.setDrawColor(...C.leaf);doc.setLineWidth(.35*s);
    doc.line(x+3.4*s,y,x+1.6*s,y+4.6*s);doc.line(x+3.4*s,y,x+5.2*s,y+4.9*s);
    doc.setFillColor(...C.leaf);doc.ellipse(x+4.7*s,y+.5*s,1.4*s,.6*s,'F');
    doc.setFillColor(...C.cherry);doc.circle(x+1.6*s,y+5.9*s,1.5*s,'F');doc.circle(x+5.2*s,y+6.2*s,1.5*s,'F');
  };
  const K={doc,C,W,H,M,
    // data da festa, data de geração e linhas extras; devolve o próximo y
    intro(extra){
      let y=36;
      if(when){doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(...C.ink);doc.text('Data da festa: ',M,y);const w=doc.getTextWidth('Data da festa: ');doc.setFont('helvetica','normal');doc.text(when,M+w,y);y+=5.5}
      doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(...C.muted);doc.text(gen,M,y);y+=6;
      (extra||[]).forEach(t=>{doc.text(t,M,y);y+=6});
      return y;
    },
    // cartões de resumo: items=[[valor, rótulo]]; valor grande em cereja
    cards(y,items,cols,big){
      cols=cols||2;const gap=6,bw=(W-2*M-gap*(cols-1))/cols,bh=19,fs=big||22;
      items.forEach((k,i)=>{
        const x=M+(i%cols)*(bw+gap),yy=y+Math.floor(i/cols)*(bh+gap*.8);
        doc.setFillColor(...C.blush2);doc.setDrawColor(...C.line);doc.setLineWidth(.3);doc.roundedRect(x,yy,bw,bh,2.5,2.5,'FD');
        if(cols>2){ // valor em cima, rótulo embaixo
          doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...C.muted);doc.text(doc.splitTextToSize(k[1],bw-10)[0],x+5,yy+6.4);
          doc.setFont('times','bold');doc.setFontSize(fs);doc.setTextColor(...(k[2]||C.cherry));doc.text(String(k[0]),x+5,yy+14.6);
        }else{
          doc.setFont('times','bold');doc.setFontSize(fs);doc.setTextColor(...C.cherry);doc.text(String(k[0]),x+6,yy+12.6);
          const nw=doc.getTextWidth(String(k[0]));
          doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(...C.ink);const ln=doc.splitTextToSize(k[1],bw-nw-16);doc.text(ln,x+nw+10,yy+(ln.length>1?9.4:11.6));
        }
      });
      return y+Math.ceil(items.length/cols)*(bh+gap*.8)-gap*.8+7;
    },
    // título de seção dentro do documento; pula de página se não couber
    section(y,text,need){
      if(y+(need||30)>H-24){doc.addPage();y=36}
      doc.setFont('times','bold');doc.setFontSize(13);doc.setTextColor(...C.deep);doc.text(text,M,y);
      return y+3.5;
    },
    table(opts){
      const t=Object.assign({theme:'grid',showHead:'everyPage',showFoot:'lastPage',rowPageBreak:'avoid',
        margin:{top:32,bottom:20,left:M,right:M},
        styles:{font:'helvetica',fontSize:9.5,textColor:C.ink,cellPadding:{top:2.4,bottom:2.4,left:2.6,right:2.6},lineColor:C.line,lineWidth:.2,overflow:'linebreak',valign:'top'},
        headStyles:{fillColor:C.cherry,textColor:[255,255,255],fontStyle:'bold',valign:'middle'},
        footStyles:{fillColor:C.blush,textColor:C.deep,fontStyle:'bold'},
        alternateRowStyles:{fillColor:C.blush2}},opts);
      if(typeof window.autoTable==='function')window.autoTable(doc,t);else doc.autoTable(t);
      return doc.lastAutoTable.finalY+9;
    },
    // cabeçalho e rodapé em todas as páginas, com numeração quando há mais de uma
    frame(){
      const pages=doc.getNumberOfPages();
      for(let i=1;i<=pages;i++){
        doc.setPage(i);
        cherryAt(M,10,1.15);
        doc.setFont('times','bold');doc.setFontSize(17);doc.setTextColor(...C.cherry);doc.text(title,M+10,16);
        doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(...C.muted);doc.text(sub+(i>1?' (continuação)':''),M+10,22);
        if(when){doc.setFontSize(9);doc.text(when,W-M,22,{align:'right'})}
        doc.setDrawColor(...C.cherry);doc.setLineWidth(.6);doc.line(M,26,W-M,26);
        doc.setDrawColor(...C.line);doc.setLineWidth(.3);doc.line(M,H-14,W-M,H-14);
        cherryAt(M,H-11.2,.62);
        doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...C.muted);
        doc.text(title+' · '+sub,M+6,H-8.6);
        if(pages>1)doc.text('Página '+i+' de '+pages,W-M,H-8.6,{align:'right'});
      }
      return doc;
    }
  };
  return K;
}
function buildReportPdf(J,list){
  const K=pdfKit(J,'Lista de convidados confirmados'),C=K.C,people=reportPeople(list);
  const filters=[rFilter.group?'grupo “'+rFilter.group+'”':'',rFilter.q.trim()?'nome contendo “'+rFilter.q.trim()+'”':''].filter(Boolean);
  let y=K.intro(filters.length?['Filtro aplicado: '+filters.join(' e ')]:[]);
  y=K.cards(y,[[list.length,list.length===1?'convite confirmado':'convites confirmados'],[people,people===1?'pessoa esperada, com acompanhantes':'pessoas esperadas, com acompanhantes']]);
  const notes=rFilter.notes;
  const head=['#','Convidado','Acompanhantes','Pessoas'].concat(notes?['Observações']:[]);
  const body=list.map((g,i)=>{
    const comp=(g.companions||[]).filter(Boolean);
    const obs=[g.diet?'Restrição: '+g.diet:'',g.notes||''].filter(Boolean).join('\n');
    return [String(i+1),g.name,comp.length?comp.join(', '):'—',String(1+comp.length)].concat(notes?[obs||'—']:[]);
  });
  K.table({head:[head],body,foot:[['','Total','',String(people)].concat(notes?['']:[])],startY:y,
    columnStyles:notes?{0:{cellWidth:9,halign:'right',textColor:C.muted},1:{cellWidth:44,fontStyle:'bold'},2:{cellWidth:50},3:{cellWidth:21,halign:'center'},4:{cellWidth:'auto'}}
                      :{0:{cellWidth:9,halign:'right',textColor:C.muted},1:{cellWidth:62,fontStyle:'bold'},2:{cellWidth:'auto'},3:{cellWidth:21,halign:'center'}}});
  return K.frame();
}
// ---- resumo financeiro (só no painel; nada é pago pelo app)
function pdfMoney(v){return money(v).replace(/−/g,'-')}
function buildFinancePdf(J){
  const K=pdfKit(J,'Resumo financeiro'),C=K.C,f=fin(),ex=S.expenses.slice();
  const demo=ex.some(x=>x.demo);
  let y=K.intro(['Registro e acompanhamento dos gastos. Nenhum pagamento é feito pelo app.'].concat(demo?['Itens marcados com (exemplo) são fictícios e entram nos totais, como no painel.']:[]));
  const diffLabel=f.budget?(f.diff>=0?'Sobra do orçamento':'Orçamento estourado em'):'Sobra do orçamento';
  y=K.cards(y,[
    [f.budget?pdfMoney(f.budget):'Não definido','Orçamento total'],
    [pdfMoney(f.planned),'Total previsto'],
    [pdfMoney(f.spent),'Total gasto (valores finais)'],
    [pdfMoney(f.paid),'Já pago'+(f.committed?' · '+Math.round(f.paid/f.committed*100)+'% do custo':'')],
    [pdfMoney(f.pending),'Falta pagar'],
    [f.budget?pdfMoney(Math.abs(f.diff)):'—',diffLabel,f.budget&&f.diff<0?C.deep:C.cherry]
  ],3,15);
  K.doc.setFont('helvetica','normal');K.doc.setFontSize(9.5);K.doc.setTextColor(...C.ink);
  K.doc.text('Custo total considerado (valor final ou, se não houver, o previsto): '+pdfMoney(f.committed),K.M,y-1.5);y+=6;
  const R={halign:'right'};
  // gastos por categoria
  const byCat={};ex.forEach(x=>{const c=x.category;byCat[c]=byCat[c]||{cost:0,paid:0,bal:0,n:0};byCat[c].cost+=cost(x);byCat[c].paid+=Number(x.paid)||0;byCat[c].bal+=balance(x);byCat[c].n++});
  const cats=Object.entries(byCat).sort((a,b)=>b[1].cost-a[1].cost);
  if(cats.length){
    y=K.section(y,'Gastos por categoria');
    y=K.table({startY:y,head:[['Categoria','Itens','Custo','Pago','Falta pagar','% do custo']],
      body:cats.map(([k,v])=>[CATS[k]||k,String(v.n),pdfMoney(v.cost),pdfMoney(v.paid),pdfMoney(v.bal),(f.committed?Math.round(v.cost/f.committed*100):0)+'%']),
      foot:[['Total',String(ex.length),pdfMoney(f.committed),pdfMoney(f.paid),pdfMoney(f.pending),f.committed?'100%':'0%']],
      columnStyles:{0:{fontStyle:'bold'},1:{cellWidth:16,halign:'center'},2:Object.assign({cellWidth:30},R),3:Object.assign({cellWidth:30},R),4:Object.assign({cellWidth:30},R),5:Object.assign({cellWidth:22},R)},
      didParseCell:d=>{if(d.section!=='body'&&d.column.index>=2)d.cell.styles.halign=d.column.index===1?'center':'right';if(d.section!=='body'&&d.column.index===1)d.cell.styles.halign='center'}});
  }
  // despesas, por vencimento
  y=K.section(y,'Despesas');
  const rows=ex.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||a.desc.localeCompare(b.desc,'pt-BR'));
  if(!rows.length){doc0(K,y,'Nenhuma despesa lançada ainda.');return K.frame()}
  // a coluna Despesa tem largura fixa e o texto já vai quebrado em linhas (evita o jsPDF juntar linhas ao quebrar)
  const DW=40,dw=DW-4.4-.8;
  const descCell=x=>{
    K.doc.setFontSize(8.8);K.doc.setFont('helvetica','bold');const a=K.doc.splitTextToSize(x.desc+(x.demo?' (exemplo)':''),dw);
    K.doc.setFont('helvetica','normal');const b=x.supplier?K.doc.splitTextToSize(x.supplier,dw):[];
    return {content:a.concat(b).join('\n'),n:a.length};
  };
  K.table({startY:y,head:[['Despesa','Categoria','Situação','Vencimento','Custo','Pago','Saldo']],
    body:rows.map(x=>{const ds=dueState(x);return [descCell(x),CATS[x.category]||x.category,EXP_ST[x.status]||x.status,x.due?fmtDate(x.due)+(ds==='overdue'?'\nvencida':ds==='soon'?'\nvence em breve':''):'—',pdfMoney(cost(x)),pdfMoney(x.paid),balance(x)>0?pdfMoney(balance(x)):'Quitado']}),
    foot:[['Total','','','',pdfMoney(f.committed),pdfMoney(f.paid),pdfMoney(f.pending)]],
    styles:{font:'helvetica',fontSize:8.8,textColor:C.ink,cellPadding:{top:2.2,bottom:2.2,left:2.2,right:2.2},lineColor:C.line,lineWidth:.2,overflow:'linebreak',valign:'top'},
    columnStyles:{0:{cellWidth:DW,fontStyle:'normal',overflow:'visible'},1:{cellWidth:24},2:{cellWidth:23},3:{cellWidth:22},4:Object.assign({cellWidth:23},R),5:Object.assign({cellWidth:23},R),6:Object.assign({cellWidth:23},R)},
    didParseCell:d=>{
      if(d.column.index>=4)d.cell.styles.halign='right';
      if(d.section==='body'&&d.column.index===3&&/vencida/.test(d.cell.raw||''))d.cell.styles.textColor=C.deep,d.cell.styles.fontStyle='bold';
    },
    // descrição em negrito e fornecedor em cinza na mesma célula: o texto é desenhado à mão
    willDrawCell:d=>{if(d.section==='body'&&d.column.index===0){d.cell.__lines=d.cell.text;d.cell.text=[]}},
    didDrawCell:d=>{
      if(d.section!=='body'||d.column.index!==0||!d.cell.__lines)return;
      const n=d.cell.raw.n,fs=d.cell.styles.fontSize,l=fs/K.doc.internal.scaleFactor,lh=l*1.15;
      let yy=d.cell.y+d.cell.padding('top')+l*.85;
      d.cell.__lines.forEach((t,i)=>{K.doc.setFont('helvetica',i<n?'bold':'normal');K.doc.setTextColor(...(i<n?C.ink:C.muted));K.doc.text(t,d.cell.x+d.cell.padding('left'),yy);yy+=lh});
    }});
  return K.frame();
}
function doc0(K,y,t){K.doc.setFont('helvetica','normal');K.doc.setFontSize(10);K.doc.setTextColor(...K.C.muted);K.doc.text(t,K.M,y+4)}
function finFileName(){return 'resumo-financeiro-'+(slug(S.party.name)||'festa')+'-'+partyAge()+'-anos.pdf'}
let finBusy=false;
async function downloadFinancePdf(){
  if(finBusy)return;
  finBusy=true;render();
  try{
    const J=await loadPdfLib();
    const doc=buildFinancePdf(J);const name=finFileName();
    doc.save(name);toast('PDF gerado: '+name);
  }catch(e){console.error(e);toast('Não foi possível gerar o PDF agora. Verifique a conexão e tente de novo.')}

}

function taskForm(t){

  openModal(t.id?'Editar tarefa':'Nova tarefa','<form data-form="task" data-id="'+(t.id||'')+'" class="stack" novalidate>'+
   '<label class="field"><span>Tarefa *</span><input class="input" id="tf-name" name="name" maxlength="100" value="'+esc(t.name)+'" required></label>'+

function resizeImage(file,cb){
  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=900;let w=img.width,h=img.height;if(w>max||h>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',.82))};img.onerror=()=>toast('Não conseguimos abrir essa imagem. Tente JPG ou PNG.');img.src=r.result};r.readAsDataURL(file);
}

const NO_DRAFT=['login','access'];
function draftable(f){const k=f&&f.dataset&&f.dataset.form;return !!k&&!NO_DRAFT.includes(k)&&!k.startsWith('rsvp')}
function draftKey(f){return KEY+':draft:'+f.dataset.form+':'+(f.dataset.id||'novo')}
function draftSave(f){
  const o={};f.querySelectorAll('input[name],select[name],textarea[name]').forEach(el=>{if(el.type==='file'||el.type==='password')return;if(el.type==='checkbox')o[el.name]=el.checked;else if(el.type==='radio'){if(el.checked)o[el.name]=el.value}else o[el.name]=el.value});
  try{localStorage.setItem(draftKey(f),JSON.stringify(o))}catch(_){}
}
function draftClear(f){try{localStorage.removeItem(draftKey(f))}catch(_){}}
function draftRestore(f){
  let o=null;try{o=JSON.parse(localStorage.getItem(draftKey(f))||'null')}catch(_){}
  if(!o)return;let changed=false;
  f.querySelectorAll('input[name],select[name],textarea[name]').forEach(el=>{if(!(el.name in o)||el.type==='file'||el.type==='password')return;
    if(el.type==='checkbox'){if(el.checked!==!!o[el.name]){el.checked=!!o[el.name];changed=true}}
    else if(el.type==='radio'){const c=el.value===o[el.name];if(el.checked!==c){el.checked=c;changed=true}}
    else if(el.value!==String(o[el.name])){el.value=o[el.name];changed=true}});
  if(!changed){draftClear(f);return}
  if(!f.querySelector('.draft-note'))f.insertAdjacentHTML('afterbegin','<div class="notice info small draft-note">'+ic('info')+'<span>Recuperamos o que você estava preenchendo e ainda não foi salvo.</span><button type="button" class="btn sm ghost" data-act="draft-discard">Descartar</button></div>');
  if(document.getElementById('ef-saldo'))updSaldo();
}

  }
  if(kind==='task'){
    const err=document.getElementById('tf-err');const name=v('name');if(name.length<2){err.textContent='Dê um nome para a tarefa.';document.getElementById('tf-name').focus();return}
    const data={name,category:v('category'),owner:v('owner'),due:v('due'),status:v('status'),notes:v('notes'),expenseId:v('expenseId')};
    const old=form.dataset.id&&byId(S.tasks,form.dataset.id);if(old)Object.assign(old,data);else S.tasks.push(Object.assign({id:uid()},data));
    save();closeModal();render();toast(old?'Tarefa atualizada':'Tarefa criada');return;
  }
  if(kind==='exp'){
    const err=document.getElementById('ef-err');const desc=v('desc');
    const planned=parseMoney(v('planned')),final=parseMoney(v('final')),paid=parseMoney(v('paid'));
    if(desc.length<2){err.textContent='Descreva o gasto.';document.getElementById('ef-desc').focus();return}
    if([planned,final,paid].some(n=>isNaN(n)||n<0)){err.textContent='Use apenas números nos valores, por exemplo 1.250,00.';return}
    if(!(planned>0)&&!(final>0)){err.textContent='Informe o valor previsto ou o valor final.';document.getElementById('ef-planned').focus();return}
    const c=final>0?final:planned;if(paid>c){err.textContent='O valor pago ('+money(paid)+') é maior que o custo ('+money(c)+'). Confira os valores.';return}
    let status=v('status');
    if(paid>0&&paid>=c)status='pago';else if(paid>0&&paid<c)status='parcial';else if(status==='pago'||status==='parcial'){status='pendente'}
    const data={desc,category:v('category'),supplier:v('supplier'),planned:planned||0,final:final||0,due:v('due'),status,method:v('method'),paid:paid||0,notes:v('notes'),receipt:v('receipt')};
    const old=form.dataset.id&&byId(S.expenses,form.dataset.id);if(old)Object.assign(old,data,{demo:false});else S.expenses.push(Object.assign({id:uid(),demo:false},data));
    save();closeModal();render();toast(old?'Despesa atualizada':'Despesa salva');return;
  }
  if(kind==='party'){
    const err=document.getElementById('pf-err');const p=S.party;
    if(v('name').length<2){err.textContent='Informe o nome da aniversariante.';return}
    const budget=parseMoney(v('budget'));if(isNaN(budget)||budget<0){err.textContent='Orçamento inválido. Use números, por exemplo 15.000,00.';document.getElementById('pf-budget').focus();return}
    const cp=digits(v('contactPhone'));if(cp&&(cp.length<10||cp.length>13)){err.textContent='WhatsApp do contato inválido. Use DDD + número.';return}
    const url=v('inviteUrl');if(url&&!/^https?:\/\//i.test(url)){err.textContent='O link do convite precisa começar com https://';return}
    Object.assign(p,{name:v('name'),age:parseInt(v('age'))||40,tagline:v('tagline')||p.tagline,welcome:v('welcome'),date:v('date'),time:v('time'),endTime:v('endTime'),venue:v('venue'),address:v('address'),dress:v('dress'),parking:v('parking'),notes:v('notes'),contactName:v('contactName'),contactPhone:cp,rsvpOpen:!!fd.get('rsvpOpen'),rsvpDeadline:v('rsvpDeadline'),maxCompanions:Math.max(0,parseInt(v('maxCompanions'))||0),budget:budget||0,inviteUrl:url});
    save();render();toast('Dados da festa salvos');return;
  }
  if(kind==='access'){
    const err=document.getElementById('pin-err');const email=v('email').toLowerCase(),a=fd.get('p1')||'',b=fd.get('p2')||'';
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){err.textContent='Informe um e-mail válido.';return}
    if(a&&a.length<6){err.textContent='A senha precisa ter pelo menos 6 caracteres.';return}
    if(a!==b){err.textContent='As duas senhas não são iguais.';return}
    if(REMOTE){rpc('admin_set_login',{email:cred.email,password:cred.password,new_email:email,new_password:a}).then(r=>{if(r&&r.ok){cred={email,password:a||cred.password,emails:cred.emails||[]};try{sessionStorage.setItem(KEY+':cred',JSON.stringify(cred))}catch(_){}form.reset();err.textContent='';render();toast('Acesso atualizado')}else err.textContent=r&&r.error==='weak_password'?'A senha precisa ter pelo menos 6 caracteres.':r&&r.error==='invalid_email'?'Informe um e-mail válido.':'Não foi possível salvar o acesso.'}).catch(()=>{err.textContent='Não foi possível salvar agora. Verifique a conexão.'});return}
    S.adminEmail=email;if(a){S.pinHash=pinHash(a);S.pinDefault=false}save();try{sessionStorage.setItem(KEY+':auth',S.pinHash)}catch(_){}render();toast('Acesso atualizado');return;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.querySelector('#modalRoot .overlay'))closeModal()});

/* ---------------- início ---------------- */
async function boot(){
  load();rsvp=newRsvp();
  if(/^https?:$/.test(location.protocol)&&!inFrame){
    const app=document.getElementById('app');
    app.innerHTML='<main class="login gutter"><div class="card" style="text-align:center"><div style="width:56px;margin:0 auto 10px">'+cherry()+'</div><p class="muted">Carregando o convite…</p></div></main>';
    try{
      const pub=await rpc('get_public');REMOTE=true;S=freshRemote();Object.assign(S.party,pub||{});
      let c=null;try{c=JSON.parse(sessionStorage.getItem(KEY+':cred')||'null');sessionStorage.removeItem(KEY+':pin')}catch(_){}
      if(c&&c.email&&c.password){try{const r=await adminLogin(c.email,c.password);if(!r.ok)sessionStorage.removeItem(KEY+':cred')}catch(_){}}
    }catch(e){
      if(e.code!=='no_api'){app.innerHTML='<main class="login gutter"><div class="card stack" style="text-align:center"><div style="width:56px;margin:0 auto">'+cherry()+'</div><h1 style="font-size:1.5rem">Não foi possível carregar o convite</h1><p class="muted">Verifique sua conexão e tente de novo.</p><button class="btn primary" data-act="reload">Tentar de novo</button></div></main>';return}
    }
  }
  if(!REMOTE){try{authed=sessionStorage.getItem(KEY+':auth')===S.pinHash}catch(e){authed=false}}
  rsvp=newRsvp();rsvpRestore();
  invitee=readGuestParam();
  if(invitee&&!rsvp.name&&rsvp.step===1){rsvp.name=invitee.name;rsvp.phone=invitee.phone?fmtPhone(invitee.phone):''}
  render();
}
boot();
})();
</script>
